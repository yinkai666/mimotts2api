services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mimotts-postgres
    environment:
      POSTGRES_DB: mimotts
      POSTGRES_USER: mimotts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mimotts_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mimotts-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimotts"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mimotts-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://mimotts:${POSTGRES_PASSWORD:-mimotts_password}@postgres:5432/mimotts
      JWT_SECRET: ${JWT_SECRET}
      MIMO_API_BASE_URL: ${MIMO_API_BASE_URL:-https://api.xiaomimimo.com/v1}
      MIMO_API_KEY: ${MIMO_API_KEY}
      PROXY_AUTH_TOKEN: ${PROXY_AUTH_TOKEN}
      STORAGE_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-60}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - mimotts-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mimotts-frontend
    environment:
      NODE_ENV: production
    networks:
      - mimotts-network
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mimotts-nginx
    ports:
      - "${PORT:-14678}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mimotts-network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

networks:
  mimotts-network:
    driver: bridge
